name: Python tests
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: linux-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Install scanners for loopback integration tests
        run: sudo apt-get update -qq && sudo apt-get install -y whatweb nmap
      - run: bash -n scripts/setup-linux.sh
      - run: node --check report.js
      - run: node --test tests/report.test.cjs
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
