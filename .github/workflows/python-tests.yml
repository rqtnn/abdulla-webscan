name: Python tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - name: Install scanners for loopback integration tests
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y whatweb nmap
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
